<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reddiac Technology</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="reddiac_ico_vetor.svg">

  <style>
    :root {
      --reddiac-bg: #201913;      /* background */
      --reddiac-gray: #5B5B5F;    /* technical gray */
      --reddiac-blue: #4A72B2;    /* industrial blue */
      --text-main: #F2F2F2;
      --text-soft: #C8C8C8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--reddiac-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    main.frame {
      position: relative;
      width: 100%;
      max-width: 720px;
      padding: 48px 32px 40px;
      border-radius: 32px;
      background: rgba(32,25,19,0.96);
      border: 1px solid rgba(91,91,95,0.35);
      box-shadow:
        0 40px 120px rgba(0,0,0,0.6),
        0 0 0 1px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .logo img {
      width: min(260px, 65vw);
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
      opacity: 0;
      transform: translateY(24px);
      animation: logo-rise 2.6s ease-out forwards;
    }

    @keyframes logo-rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* TECHNOLOGY + light scan animation */
    .tech-orbit {
      position: relative;
      width: min(320px, 80vw);  /* mais largo, para acompanhar REDDIAC */
      margin: 14px auto 8px;
      padding-top: 10px;
    }

    .tech-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(
        to right,
        transparent,
        rgba(91,91,95,0.9),
        rgba(91,91,95,0.9),
        transparent
      );
      opacity: 0.45;
    }

    .tech-word {
      position: relative;
      font-size: 0.9rem;
      letter-spacing: 0.6em;       /* largura para acompanhar REDDIAC */
      text-indent: 0.6em;          /* compensa o primeiro espaço */
      text-transform: uppercase;
      color: var(--reddiac-gray);
      display: inline-block;
      padding: 0 4px;
      overflow: hidden;
    }

    /* luz branca “scaneando” as letras */
    .tech-word::after {
      content: "TECHNOLOGY";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 0%,
        rgba(255,255,255,0.95) 50%,
        transparent 100%
      );
      mix-blend-mode: screen;
      transform: translateX(-130%);
      animation: tech-scan 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes tech-scan {
      0% {
        transform: translateX(-130%);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      45% {
        transform: translateX(130%);
        opacity: 1;
      }
      70% {
        opacity: 0;
      }
      100% {
        transform: translateX(130%);
        opacity: 0;
      }
    }

    .tagline {
      margin-top: 18px;
      font-size: 0.85rem;
      letter-spacing: 0.26em;
      color: var(--reddiac-gray);
      text-transform: uppercase;
      opacity: 0;
      animation: fade 3s ease-out forwards;
    }

    h1 {
      margin-top: 20px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 600;
      line-height: 1.28;
      opacity: 0;
      transform: translateY(12px);
      animation: fade-up 3.6s ease-out forwards;
    }

    .mood {
      margin-top: 20px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.58;
      color: var(--reddiac-gray);
      opacity: 0;
      transform: translateY(12px);
      animation: fade-up 4.2s ease-out forwards;
    }

    @keyframes fade { to { opacity: 1; } }

    @keyframes fade-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .divider {
      margin: 28px auto;
      width: 90px;
      height: 1px;
      background: linear-gradient(to right,
        transparent,
        var(--reddiac-blue),
        transparent
      );
      opacity: 0;
      animation: fade 4.8s ease-out forwards;
    }

    .email {
      font-size: 0.9rem;
      color: var(--reddiac-gray);
      opacity: 0;
      animation: fade 5.4s ease-out forwards;
    }

    .email a {
      color: var(--reddiac-blue);
      text-decoration: none;
      border-bottom: 1px solid rgba(74,114,178,0.35);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .email a:hover {
      color: #a9c7ff;
      border-color: #a9c7ff;
    }

    .corner {
      position: absolute;
      right: 24px;
      bottom: 16px;
      font-size: 0.72rem;
      color: var(--reddiac-gray);
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      main.frame { border-radius: 24px; padding: 36px 20px; }
      .corner { display: none; }
      .tech-orbit { margin-top: 12px; }
    }
  </style>
</head>

<body>
  <main class="frame">
    <div class="content">
      <div class="logo">
        <img src="reddiac-logo.svg" alt="Reddiac Technology">
      </div>

      <!-- TECHNOLOGY + white light scan -->
      <div class="tech-orbit" aria-hidden="true">
        <div class="tech-line"></div>
        <!-- <div class="tech-word">TECHNOLOGY</div> -->
      </div>

      <p class="tagline">Technology Beyond The Eyes</p>

      <h1></h1>

      <p class="mood">
        Before the machines, there is engineering.  
        Before the products, there is purpose.  
        This is how Reddiac is born — quiet, precise, and inevitable.
      </p>

      <div class="divider"></div>

      <p class="email">
        <a href="mailto:contato@reddiac.com">contato@reddiac.com</a>
      </p>
    </div>

    <div class="corner">REDDIAC • RN • BRAZIL</div>
  </main>
</body>
</html>
